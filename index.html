<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BC Marmoraria</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ===== SOBRE COM IMAGENS CORRETAS ===== */
.sobre-box{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:40px;
}

.sobre-imagens{
display:flex;
flex-direction:column;
gap:16px;
flex-shrink:0;
}

.sobre-imagens img{
width:450px;
height:auto;
display:block;
border-radius:6px;
}

.sobre-texto{
max-width:700px;
line-height:2.0;
font-size:17px;
color:#ccc;
}

/* MOBILE */
@media(max-width:900px){
.sobre-box{
flex-direction:column;
align-items:center;
text-align:center;
}

.sobre-imagens img{
width:90%;
max-width:450px;
}
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#0f0f0f;
color:#fff;
}

/* HEADER */
header{
background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:3px solid #c9a24d;
}

.logo img{
height:120px;
}

.frase-topo{
font-family:'Playfair Display', serif;
font-size:32px;
color:#ddd;
text-align:center;
flex:1;
letter-spacing:1px;
}

nav a{
color:#fff;
text-decoration:none;
margin-left:25px;
font-size:14px;
text-transform:uppercase;
}

nav a:hover{
color:#c9a24d;
}

/* HERO */
.hero{
width:100%;
background-image:url("imagens/fundo-imagem-marmore.jpeg");
background-position:center;
background-size:cover;
background-repeat:no-repeat;
position:relative;
padding:120px 20px 100px;
text-align:center;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.45);
}

.hero > *{
position:relative;
z-index:2;
}

.hero-frase{
font-size:36px;
font-weight:500;
max-width:1050px;
margin:0 auto 40px;
line-height:1.5;
}

.hero-subfrase{
font-size:22px;
color:#000;
margin-bottom:40px;
}

/* GALERIA */
.galeria{
max-width:1320px;
margin:0 auto 60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.galeria img{
width:100%;
height:240px;
object-fit:cover;
border-radius:6px;
cursor:pointer;
transition:transform .3s;
}

.galeria img:hover{
transform:scale(1.03);
}

@media (max-width:768px){
.galeria{
grid-template-columns:repeat(2,1fr);
}
}

/* BOTÃO */
.hero a{
display:inline-block;
padding:16px 45px;
background:#25d366;
color:#000;
font-weight:bold;
text-decoration:none;
text-transform:uppercase;
margin-top:20px;
}

/* LIGHTBOX */
.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
display:none;
align-items:center;
justify-content:center;
z-index:999;
padding:20px;
}

.lightbox-content{
display:flex;
align-items:flex-start;
justify-content:center;
gap:30px;
max-width:90%;
max-height:90%;
flex-wrap:wrap;
}

.lightbox img{
max-width:600px;
max-height:80vh;
border-radius:8px;
object-fit:contain;
}

.lightbox-text{
color:#fff;
max-width:400px;
font-size:18px;
line-height:1.6;
font-family:'Playfair Display', serif;
text-align:left;
}

.lightbox-text h2{
font-size:24px;
margin-bottom:10px;
font-weight:600;
}

@media(max-width:900px){
.lightbox-content{
flex-direction:column;
align-items:center;
}
.lightbox-text{
max-width:90%;
margin-top:15px;
}
}

/* SEÇÕES */
section{
padding:80px 40px;
max-width:1200px;
margin:auto;
}

section h3{
text-align:center;
font-size:30px;
margin-bottom:40px;
}

.sobre p{
max-width:900px;
margin:auto;
text-align:center;
line-height:1.9;
color:#ccc;
}

.localizacao-box{
text-align:center;
max-width:800px;
margin:auto;
}

.localizacao-box p a{
color:#c9a24d;
text-decoration:underline;
font-weight:bold;
}

.localizacao-box iframe{
width:100%;
height:300px;
border:0;
border-radius:8px;
margin-top:10px;
}

.servicos-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.servicos-grid img{
width:100%;
height:auto;
border-radius:6px;
}

.contact-box{
text-align:center;
font-size:18px;
line-height:2;
}

.contact-box a{
color:#c9a24d;
text-decoration:none;
font-weight:bold;
}

@media(max-width:900px){

header{
flex-direction:column;
gap:15px;
text-align:center;
}

.frase-topo{
font-size:22px;
}

nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

nav a{
margin-left:0;
}

.logo img{
height:80px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<img src="imagens/logo-teste.jpeg" alt="Logo BC Marmoraria">
</div>

<div class="frase-topo">
Marmoraria e Porcelanataria
</div>

<nav>
<a href="#">Home</a>
<a href="#produtos">Serviços</a>
<a href="#sobre">Sobre</a>
<a href="#localizacao">Localização</a>
<a href="#contato">Contato</a>
</nav>

</header>

<div class="hero">

<p class="hero-frase">
Excelência em mármores, granitos, quartzitos e superfícies ultracompactas para projetos exclusivos.
</p>

<p class="hero-subfrase">
clique e conheça a aplicação e detalhes de cada material
</p>

<div class="galeria">

<img src="imagens/carrosel1.png"
data-title="Granito Preto"
data-desc="Material de alta resistência e baixa porosidade, ideal para bancadas de cozinha e banheiro. Sua tonalidade elegante e acabamento preciso garantem durabilidade, fácil manutenção e sofisticação atemporal."
onclick="abrirImagem(this)">

<img src="imagens/carroself2.png"
data-title="Lâmina Ultracompacto"
data-desc="Material de alta tecnologia, desenvolvido para oferecer máxima resistência, precisão estética e versatilidade de aplicação."
onclick="abrirImagem(this)">

<img src="imagens/carroself3.png"
data-title="Mármore Branco Paraná (Dolomítico)"
data-desc="Mármore dolomítico de excelente resistência, indicado para bancadas de cozinha, banheiro e áreas internas."
onclick="abrirImagem(this)">

<img src="imagens/carroself4.png"
data-title="Quartzito"
data-desc="O quartzito é uma pedra natural de alta performance."
onclick="abrirImagem(this)">

<img src="imagens/carroself5.png"
data-title="Quartzo"
data-desc="Superfície moderna, resistente e de baixa porosidade."
onclick="abrirImagem(this)">

<img src="imagens/carroself6.png"
data-title="Travertino Romano"
data-desc="Pedra natural de estética clássica e textura marcante, o Travertino Romano confere elegância atemporal e identidade única aos projetos."
onclick="abrirImagem(this)">

</div>

<a href="https://wa.me/5519994844122" target="_blank">
Solicitar orçamento
</a>

</div>

<div class="lightbox" id="lightbox">
<span onclick="fecharImagem()" style="position:absolute;top:20px;right:30px;font-size:40px;color:#fff;cursor:pointer;">×</span>

<div class="lightbox-content">
<img id="lightbox-img">

<div class="lightbox-text">
<h2 id="lightbox-title"></h2>
<p id="lightbox-desc"></p>
</div>

</div>
</div>

<script>

function abrirImagem(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
document.getElementById("lightbox-title").innerText=img.dataset.title;
document.getElementById("lightbox-desc").innerText=img.dataset.desc;
}

function fecharImagem(){
document.getElementById("lightbox").style.display="none";
}

</script>

</body>
</html>
